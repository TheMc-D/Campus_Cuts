<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Log in - Campus Cuts</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="container narrow">
    <h1>Log in</h1>

    <p th:if="${param.error}" class="error">Incorrect email or password.</p>
    <p th:if="${param.signedUp}" class="success">Account created — log in below.</p>

    <form method="post" action="/login" class="form">
        <label>Email <input type="email" name="username" required/></label>
        <label>Password <input type="password" name="password" required/></label>
        <button type="submit">Log in</button>
    </form>

    <p>No account yet? <a href="/signup">Sign up</a></p>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
