<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sign up - Campus Cuts</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="container narrow">
    <h1>Sign up</h1>

    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <form method="post" action="/signup" th:action="@{/signup}" th:object="${signupForm}" class="form">
        <label>Full name
            <input type="text" th:field="*{fullName}" required/>
            <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </label>
        <label>Email
            <input type="email" th:field="*{email}" required/>
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label>
        <label>Password
            <input type="password" th:field="*{password}" required/>
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </label>
        <label>School
            <select th:field="*{schoolId}" required>
                <option value="" disabled selected>Choose your school</option>
                <option th:each="school : ${schools}" th:value="${school.id}" th:text="${school.name + ' (' + school.state + ')'}"></option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('schoolId')}" th:errors="*{schoolId}"></span>
        </label>
        <button type="submit">Create account</button>
    </form>

    <p>Already have an account? <a href="/login">Log in</a></p>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
